<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendar</title>
    <link rel="stylesheet" href="/plugin-ui/kit/style.css" />
    <link rel="stylesheet" href="calendar.css" />
  </head>
  <body>
    <header class="bar">
      <strong>Calendar</strong>
      <span id="status" class="muted"></span>
      <span class="grow"></span>
      <button id="prev" type="button" aria-label="Previous week">‹</button>
      <button id="today" type="button">Today</button>
      <button id="next" type="button" aria-label="Next week">›</button>
      <button id="refresh" type="button" title="Fetch from the server now">↻</button>
      <button id="add" type="button" class="primary">New event</button>
    </header>
    <div id="error" class="error" hidden></div>
    <main class="layout">
      <section id="days" class="days" aria-live="polite"></section>
      <section id="detail" class="detail"><p class="muted empty">Pick an event to change it, or add one.</p></section>
    </main>
    <script src="/plugin-ui/kit/bridge.js"></script>
    <script src="app.js"></script>
  </body>
</html>
