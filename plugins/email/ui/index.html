<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email</title>
    <link rel="stylesheet" href="/plugin-ui/kit/style.css" />
    <link rel="stylesheet" href="email.css" />
  </head>
  <body>
    <header class="bar">
      <strong>Email</strong>
      <span id="status" class="muted"></span>
      <span class="grow"></span>
      <button id="compose" type="button" class="primary">New email</button>
    </header>
    <div id="error" class="error" hidden></div>
    <main class="layout">
      <section class="list-pane">
        <form id="search" class="row">
          <input id="query" type="search" placeholder="Search subject, sender, text" aria-label="Search" />
        </form>
        <nav id="filters" class="row filters" aria-label="Filters"></nav>
        <div id="list" class="list" role="list"></div>
        <button id="more" type="button" hidden>Show more</button>
      </section>
      <section id="reader" class="reader">
        <p class="muted empty">Pick an email to read it.</p>
      </section>
    </main>
    <script src="/plugin-ui/kit/bridge.js"></script>
    <script src="app.js"></script>
  </body>
</html>
