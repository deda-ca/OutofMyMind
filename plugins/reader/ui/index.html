<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Read aloud</title>
    <link rel="stylesheet" href="/plugin-ui/kit/style.css" />
    <link rel="stylesheet" href="reader.css" />
  </head>
  <body>
    <!-- One bar: what it is, the player, where it is, the text size, the speech model, the voice. -->
    <header class="bar">
      <strong id="title" class="title">Read aloud</strong>
      <span class="group" role="group" aria-label="Player">
        <button id="prev" type="button" title="Previous sentence" aria-label="Previous sentence">⏮</button>
        <button id="play" type="button" class="primary play">▶ Play</button>
        <button id="stop" type="button" title="Stop" aria-label="Stop">⏹</button>
        <button id="next" type="button" title="Next sentence" aria-label="Next sentence">⏭</button>
      </span>
      <span id="position" class="muted position"></span>
      <span class="grow"></span>
      <span class="group" role="group" aria-label="Text size">
        <button id="smaller" type="button" title="Smaller text (Ctrl −)" aria-label="Smaller text">A−</button>
        <button id="bigger" type="button" title="Bigger text (Ctrl +)" aria-label="Bigger text">A+</button>
      </span>
      <select id="model" aria-label="Speech model" title="The speech model it's read with" hidden></select>
      <select id="voice" aria-label="Voice" title="The voice it's read in"></select>
      <select id="rate" aria-label="Speed" title="Speed"></select>
      <button id="clear" type="button" title="Clear the page" aria-label="Clear the page" hidden>🗑</button>
    </header>
    <div id="error" class="error" hidden></div>
    <div id="only-jarvis" class="muted note" hidden>Only Jarvis's voice is available: add another voice to your speech server to tell them apart.</div>
    <main class="page">
      <article
        id="text"
        class="read-text empty"
        contenteditable="true"
        spellcheck="true"
        role="textbox"
        aria-multiline="true"
        aria-label="The text to read aloud"
        data-placeholder="Paste or type here (Markdown is fine). Then press Play; click a word, or select some text, to read from there. Or ask Jarvis to read you something."
      ></article>
    </main>
    <script src="/plugin-ui/kit/bridge.js"></script>
    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/purify.js"></script>
    <script src="app.js"></script>
  </body>
</html>
